<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f7f5f0;
    --ink: #1d1c18;
    --muted: #6b675c;
    --faint: #a8a496;
    --rule: #c8c2b3;
    --accent: #2f3a8c;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    min-height: min(620px, calc(100vh - 96px));
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 34px;
  }

  .prose {
    font-size: 21px;
    line-height: 1.74;
    font-weight: 300;
    margin: 0;
    text-align: justify;
    hyphens: auto;
  }

  .dropcap {
    float: left;
    font-weight: 500;
    font-size: 82px;
    line-height: 0.66;
    margin: 9px 12px 0 0;
  }

  /* primary venture — Ren */
  .prose a.lead {
    font-weight: 700;
    color: #000;
    text-decoration: none;
  }
  .prose a.lead:hover { color: var(--accent); }

  /* project + writing links */
  .prose a:not(.lead) {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--rule);
    transition: border-color 0.2s;
  }
  .prose a:not(.lead):hover { border-color: var(--accent); }

  .footer {
    margin-top: auto;
    padding-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 24px;
  }

  .email {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .social {
    display: flex;
    gap: 16px;
    font-style: italic;
    font-size: 16px;
  }
  .social a {
    color: #94907f;
    text-decoration: none;
    transition: color 0.2s;
  }
  .social a:hover { color: var(--accent); }

  .photo {
    display: block;
    width: 100%;
    max-width: 380px;
    height: auto;
    margin: 40px auto 0;
    border-radius: 4px;
    border: 1px solid rgba(29, 28, 24, 0.08);
  }

  .mascot {
    line-height: 0;
    margin: 0 0 16px -12px;
  }
  .mascot button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 6px;
  }

  /* --- Swing -------------------------------------------------------------
     A pendulum: the whole rig pivots from a point at the very top edge of the
     window, so the ropes read as coming from somewhere above the screen.
     Amplitude lives in --swing-amp so a click can widen the arc without
     touching the period -- pushing a real swing makes it go wider, not
     faster, and leaving the period alone is also what stops it stuttering
     mid-arc when clicked. */
  @property --swing-amp {
    syntax: '<angle>';
    inherits: true;
    initial-value: 10deg;
  }

  .swing {
    --swing-amp: 10deg;
    position: fixed;
    top: 0;
    right: clamp(56px, 7vw, 140px);
    width: clamp(100px, 11vw, 152px);
    z-index: 10;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    line-height: 0;
    /* only the drawn shapes take the pointer, so it can never swallow a click
       meant for the page behind it */
    pointer-events: none;
    -webkit-tap-highlight-color: transparent;
    transition: --swing-amp 5.5s cubic-bezier(0.25, 0.6, 0.3, 1);
  }

  .swing__rig {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    transform-origin: 50% 0;
    animation: swing-arc 3.6s cubic-bezier(0.4, 0.05, 0.6, 0.95) infinite alternate;
  }

  @keyframes swing-arc {
    from { transform: rotate(calc(var(--swing-amp) * -1)); }
    to   { transform: rotate(var(--swing-amp)); }
  }

  /* the rider lags a little behind the swing, the way a real one does */
  .swing__hit {
    pointer-events: auto;
    cursor: pointer;
    transform-origin: 150px 445px;
    animation: swing-lag 3.6s cubic-bezier(0.4, 0.05, 0.6, 0.95) infinite alternate;
  }

  @keyframes swing-lag {
    from { transform: rotate(3.5deg); }
    to   { transform: rotate(-3.5deg); }
  }

  .swing__legs {
    transform-origin: 150px 440px;
    animation: swing-kick 3.6s ease-in-out infinite alternate;
  }

  @keyframes swing-kick {
    from { transform: rotate(-5deg); }
    to   { transform: rotate(5deg); }
  }

  .swing:focus-visible .swing__hit {
    outline: 2px solid var(--accent);
    outline-offset: 6px;
    border-radius: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .swing__rig,
    .swing__hit,
    .swing__legs { animation: none; }
    .swing__hit { transform: none; }
  }

  @media (max-width: 900px) {
    .swing { right: 56px; width: 92px; }
  }

  @media (max-width: 520px) {
    body { padding: 32px 20px; }
    .prose { font-size: 19px; text-align: left; }
    .dropcap { font-size: 70px; }
    .photo { margin-top: 28px; }
    .mascot { margin-bottom: 12px; }
    .mascot button { width: 92px !important; height: 92px !important; }
    /* on a phone the text column fills the screen, so the swing would sit on
       top of the prose rather than beside it */
    .swing { display: none; }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="mascot" data-mascot
         data-directions="mascots/josh-directions.webp"
         data-reactions="mascots/josh-reactions.webp"
         data-size="112"
         data-label="Josh"></div>

      <a href="https://open.spotify.com/show/5z8cQtiTnwttiPbqDkurrO?si=0b94f19d81624fd3" target="_blank" rel="noopener">Minimally Edited</a>.
      Feel free to reach out.
    </p>

    <img class="photo" src="friends.jpg" width="1280" height="831" loading="lazy"

    <footer class="footer">
      <a class="email" href="mailto:joshuahou17@gmail.com">joshuahou17 [at] gmail [dot] com</a>
      <span class="social">
        <a href="https://www.linkedin.com/in/joshua-hou/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/Joshua.hhou/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://twitter.com/macrohou" target="_blank" rel="noopener">Twitter</a>

  <!-- Decorative: cartoon Josh on a swing, hung from the top-right of the window.
       The head is cell 8 ("delighted") of the mascot's reactions atlas, so it is the
       same drawing as the mascot and costs no extra download; everything else is drawn
       here to match its measured palette (#26324b shirt, #fec294 skin, black outlines). -->
  <button class="swing" type="button" aria-label="Push the swing">
    <svg class="swing__rig" viewBox="0 0 300 560" width="300" height="560" role="presentation" focusable="false">
      <!-- ropes: black outline + rope core, running off the top edge -->
      <g class="swing__ropes">
        <path d="M40 0V445" stroke="#000" stroke-width="13" fill="none"/>
        <path d="M260 0V445" stroke="#000" stroke-width="13" fill="none"/>
        <path d="M40 0V445" stroke="#c9a875" stroke-width="6" fill="none"/>
        <path d="M260 0V445" stroke="#c9a875" stroke-width="6" fill="none"/>
      </g>

      <g class="swing__hit">
        <!-- arms: drawn before the bust so they read as raised out to the sides -->
        <g class="swing__arms">
          <path d="M88 398Q66 372 46 330" stroke="#000" stroke-width="40" fill="none" stroke-linecap="round"/>
          <path d="M212 398Q234 372 254 330" stroke="#000" stroke-width="40" fill="none" stroke-linecap="round"/>
          <path d="M88 398Q66 372 46 330" stroke="#fec294" stroke-width="31" fill="none" stroke-linecap="round"/>
          <path d="M212 398Q234 372 254 330" stroke="#fec294" stroke-width="31" fill="none" stroke-linecap="round"/>
          <circle cx="42" cy="320" r="20" fill="#fec294" stroke="#000" stroke-width="6"/>
          <circle cx="258" cy="320" r="20" fill="#fec294" stroke="#000" stroke-width="6"/>
        </g>

        <!-- head and shoulders: cell (2,2) of the 3x3 reactions atlas -->
        <svg class="swing__bust" x="30.2" y="242.2" width="235" height="235" viewBox="720 720 360 360">
          <image href="mascots/josh-reactions.webp" x="0" y="0" width="1080" height="1080"/>
        </svg>

        <!-- seat: also hides the flat bottom edge of the bust -->
        <g class="swing__seat">
          <rect x="36" y="434" width="228" height="23" rx="7" fill="#c08b4e" stroke="#000" stroke-width="6"/>
          <path d="M42 450h216" stroke="#9a6b36" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- legs hang over the front edge of the seat -->
        <g class="swing__legs">
          <path d="M126 436C120 470 114 492 113 514" stroke="#000" stroke-width="39" fill="none" stroke-linecap="round"/>
          <path d="M174 436C180 470 186 492 187 514" stroke="#000" stroke-width="39" fill="none" stroke-linecap="round"/>
          <path d="M126 436C120 470 114 492 113 514" stroke="#fec294" stroke-width="30" fill="none" stroke-linecap="round"/>
          <path d="M174 436C180 470 186 492 187 514" stroke="#fec294" stroke-width="30" fill="none" stroke-linecap="round"/>
          <path d="M127 434C124 452 121 464 120 474" stroke="#000" stroke-width="46" fill="none" stroke-linecap="round"/>
          <path d="M173 434C176 452 179 464 180 474" stroke="#000" stroke-width="46" fill="none" stroke-linecap="round"/>
          <path d="M127 434C124 452 121 464 120 474" stroke="#26324b" stroke-width="37" fill="none" stroke-linecap="round"/>
          <path d="M173 434C176 452 179 464 180 474" stroke="#26324b" stroke-width="37" fill="none" stroke-linecap="round"/>
          <ellipse cx="109" cy="528" rx="25" ry="17" fill="#2e2e2e" stroke="#000" stroke-width="6"/>
          <ellipse cx="191" cy="528" rx="25" ry="17" fill="#2e2e2e" stroke="#000" stroke-width="6"/>
        </g>
      </g>
    </svg>
  </button>
  <script src="mascot.js?v=1" defer></script>
  <script src="swing.js?v=1" defer></script>
  <script src="/analytics.js" defer></script>
</body>
