<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Josh Hou</title>
<meta name="description" content="Josh Hou — building Ren with two of my best friends.">

<link rel="shortcut icon" type="image/x-icon" href="favicon.png.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f7f5f0;
    --ink: #1d1c18;
    --muted: #6b675c;
    --faint: #a8a496;
    --rule: #c8c2b3;
    --accent: #2f3a8c;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    min-height: min(620px, calc(100vh - 96px));
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 34px;
  }

  .prose {
    font-size: 21px;
    line-height: 1.74;
    font-weight: 300;
    margin: 0;
    text-align: justify;
    hyphens: auto;
  }

  .dropcap {
    float: left;
    font-weight: 500;
    font-size: 82px;
    line-height: 0.66;
    margin: 9px 12px 0 0;
  }

  /* primary venture — Ren */
  .prose a.lead {
    font-weight: 700;
    color: #000;
    text-decoration: none;
  }
  .prose a.lead:hover { color: var(--accent); }

  /* project + writing links */
  .prose a:not(.lead) {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--rule);
    transition: border-color 0.2s;
  }
  .prose a:not(.lead):hover { border-color: var(--accent); }

  .footer {
    margin-top: auto;
    padding-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 24px;
  }

  .social {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .social a {
    display: inline-flex;
    color: #94907f;
    text-decoration: none;
    transition: color 0.2s;
  }
  .social a:hover { color: var(--accent); }

  /* --- Photo shuffle ------------------------------------------------------
     Click the photo for another. The set mixes landscape and portrait, and at
     this width a portrait shot stands about 190px taller than a landscape one,
     so the slot's height is set from the aspect ratio of whichever photo is
     showing and eased between them. Without that the footer below jumps by
     that much on every click. photos.js sets the height; with no JavaScript
     the slot simply hugs the image as it always did. */
  .shots {
    margin: 40px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: height 420ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .shot {
    display: block;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    line-height: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .shot:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 6px;
    border-radius: 6px;
  }

  .photo {
    display: block;
    width: auto;
    height: auto;
    max-width: min(380px, calc(100vw - 40px));
    max-height: min(440px, 48vh);
    border-radius: 4px;
    border: 1px solid rgba(29, 28, 24, 0.08);
  }

  @media (prefers-reduced-motion: reduce) {
    .shots { transition: none; }
  }

  .mascot {
    line-height: 0;
    margin: 0 0 16px -12px;
  }
  .mascot button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 6px;
  }

  @media (max-width: 520px) {
    body { padding: 32px 20px; }
    .prose { font-size: 19px; text-align: left; }
    .dropcap { font-size: 70px; }
    .shots { margin-top: 28px; }
    .mascot { margin-bottom: 12px; }
    .mascot button { width: 92px !important; height: 92px !important; }
  }
</style>
</head>
