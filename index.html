<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Josh Hou</title>
<meta name="description" content="Josh Hou — building Ren with two of my best friends.">

<link rel="shortcut icon" type="image/x-icon" href="favicon.png.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f7f5f0;
    --ink: #1d1c18;
    --muted: #6b675c;
    --faint: #a8a496;
    --rule: #c8c2b3;
    --accent: #2f3a8c;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .page {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    min-height: min(620px, calc(100vh - 96px));
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 34px;
  }

  .prose {
    font-size: 21px;
    line-height: 1.74;
    font-weight: 300;
    margin: 0;
    text-align: justify;
    hyphens: auto;
  }

  .dropcap {
    float: left;
    font-weight: 500;
    font-size: 82px;
    line-height: 0.66;
    margin: 9px 12px 0 0;
  }

  /* primary venture — Ren */
  .prose a.lead {
    font-weight: 700;
    color: #000;
    text-decoration: none;
  }
  .prose a.lead:hover { color: var(--accent); }

  /* project + writing links */
  .prose a:not(.lead) {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--rule);
    transition: border-color 0.2s;
  }
  .prose a:not(.lead):hover { border-color: var(--accent); }

  .footer {
    margin-top: auto;
    padding-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 24px;
  }

  .email {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .social {
    display: flex;
    gap: 16px;
    font-style: italic;
    font-size: 16px;
  }
  .social a {
    color: #94907f;
    text-decoration: none;
    transition: color 0.2s;
  }
  .social a:hover { color: var(--accent); }

  .photo {
    display: block;
    width: 100%;
    max-width: 380px;
    height: auto;
    margin: 40px auto 0;
    border-radius: 4px;
    border: 1px solid rgba(29, 28, 24, 0.08);
  }

  .mascot {
    line-height: 0;
    margin: 0 0 16px -12px;
  }
  .mascot button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 6px;
  }

  /* --- Swing -------------------------------------------------------------
     A pendulum hanging from a point at the very top edge of the window, so the
     ropes read as coming from somewhere above the screen.

     It turns on a HORIZONTAL axle, not a vertical one -- which is what a real
     swing does -- so the rig travels toward the viewer and away rather than
     sliding side to side. Under perspective that buys the whole effect for
     free: he grows coming forward, shrinks going back, rises at both ends of
     the arc, and the two ropes splay and converge. Faking the same thing in 2D
     would mean animating the rope geometry by hand.

     Amplitude lives in --swing-amp so a click can widen the arc without
     touching the period: a pendulum's timing does not depend on how hard you
     push it, and leaving the duration alone is also what keeps the phase (and
     so his position and direction) continuous through a click. swing.js eases
     that value rather than setting it, so the push reads as a shove instead of
     a jump. */
  @property --swing-amp {
    syntax: '<angle>';
    inherits: true;
    initial-value: 16deg;
  }

  .swing {
    --swing-amp: 16deg;
    /* A swing turns on a horizontal axle, so the rig swings toward the viewer
       and away rather than side to side. Under perspective that gives the real
       thing for free: he grows as he comes forward, shrinks going back, rises at
       both ends of the arc, and the ropes splay and converge. --swing-view turns
       the whole assembly a little so we see it from the corner, which turns the
       straight-on approach into an ellipse. */
    --swing-view: -22deg;
    perspective: 720px;
    perspective-origin: 50% 72%;
    position: fixed;
    top: 0;
    right: clamp(56px, 7vw, 140px);
    width: clamp(100px, 11vw, 152px);
    z-index: 10;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    line-height: 0;
    /* only the rider takes the pointer, so it can never swallow a click meant
       for the page behind it */
    pointer-events: none;
    -webkit-tap-highlight-color: transparent;
  }

  .swing__rig {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    transform-origin: 50% 0;
    animation: swing-arc 3.6s cubic-bezier(0.4, 0.05, 0.6, 0.95) infinite alternate;
  }

  @keyframes swing-arc {
    from { transform: rotateY(var(--swing-view)) rotateX(calc(var(--swing-amp) * -1)); }
    to   { transform: rotateY(var(--swing-view)) rotateX(var(--swing-amp)); }
  }

  .swing__hit {
    pointer-events: auto;
    cursor: pointer;
  }

  .swing:focus-visible .swing__hit {
    outline: 2px solid var(--accent);
    outline-offset: 6px;
    border-radius: 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .swing__rig {
      animation: none;
      transform: rotateY(var(--swing-view));
    }
  }

  @media (max-width: 900px) {
    .swing { right: 56px; width: 92px; }
  }

  @media (max-width: 520px) {
    body { padding: 32px 20px; }
    .prose { font-size: 19px; text-align: left; }
    .dropcap { font-size: 70px; }
    .photo { margin-top: 28px; }
    .mascot { margin-bottom: 12px; }
    .mascot button { width: 92px !important; height: 92px !important; }
    /* On a phone there is very little clear height above the prose, so the
       pivot is lifted above the screen: more rope falls off-frame and the
       rider can stay a usable size in the room that is left. */
    .swing {
      top: -56px;
      right: clamp(44px, 16vw, 72px);
      width: clamp(80px, 26vw, 112px);
    }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="mascot" data-mascot
         data-directions="mascots/josh-directions.webp"
         data-reactions="mascots/josh-reactions.webp"
         data-size="112"
         data-label="Josh"></div>

    <p class="eyebrow">Josh Hou · New York</p>

    <p class="prose">
      <span class="dropcap">I</span>'m building <a class="lead" href="https://www.ren.so/">Ren</a> with
      two of my best friends. Here are some newsletters I've put together —
      <a href="https://joshhou.com/digest" target="_blank" rel="noopener">Digest</a> and
      <a href="https://joshhou.com/bible" target="_blank" rel="noopener">Bible</a>. I also write on
      <a href="https://joshhou.substack.com" target="_blank" rel="noopener">my blog</a> and podcasted on
      <a href="https://open.spotify.com/show/5z8cQtiTnwttiPbqDkurrO?si=0b94f19d81624fd3" target="_blank" rel="noopener">Minimally Edited</a>.
      Feel free to reach out.
    </p>

    <img class="photo" src="friends.jpg" width="1280" height="831" loading="lazy"
         alt="Three friends walking down a New York City street at night, seen from behind, wearing backpacks.">

    <footer class="footer">
      <a class="email" href="mailto:joshuahou17@gmail.com">joshuahou17 [at] gmail [dot] com</a>
      <span class="social">
        <a href="https://www.linkedin.com/in/joshua-hou/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/Joshua.hhou/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://twitter.com/macrohou" target="_blank" rel="noopener">Twitter</a>
      </span>
    </footer>
  </main>

  <!-- Decorative: cartoon Josh on a swing, hung from the top-right of the window.
       The rider is one drawn illustration (mascots/josh-swing.webp), made from the
       mascot's own sprite sheet so it is the same character. The ropes are drawn here
       instead of in the artwork: they have to reach the pivot at the top of the window,
       and they foreshorten with the rig when it swings. His fists sit at 7.43% and 92.93%
       of the artwork's width, measured off the art; the image is placed so those
       land exactly on the two ropes. -->
  <button class="swing" type="button" aria-label="Push the swing">
    <svg class="swing__rig" viewBox="0 0 300 560" width="300" height="560" role="presentation" focusable="false">
      <!-- ropes: black outline + rope core, running off the top edge -->
      <g class="swing__ropes">
        <path d="M40 0V445" stroke="#000" stroke-width="13" fill="none"/>
        <path d="M260 0V445" stroke="#000" stroke-width="13" fill="none"/>
        <path d="M40 0V445" stroke="#c9a875" stroke-width="6" fill="none"/>
        <path d="M260 0V445" stroke="#c9a875" stroke-width="6" fill="none"/>
      </g>
      <!-- the rider, drawn over the ropes so his fists close around them -->
      <image class="swing__hit" href="mascots/josh-swing.webp" x="20.9" y="149.7" width="257.3" height="406.2"/>
    </svg>
  </button>
  <script src="mascot.js?v=1" defer></script>
  <script src="swing.js?v=2" defer></script>
  <script src="/analytics.js" defer></script>
</body>
</html>
