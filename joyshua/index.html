<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>joyshua</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ece4d3">

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@500;700&family=Special+Elite&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="joyshua.css?v=8">
</head>
<body>

<main class="stage" id="stage" aria-label="Postcards. Drag to wander, select a postcard to open it.">
  <div class="world" id="world"></div>
</main>

<header class="mast">
  <h1 class="mast-title">joyshua</h1>
  <p class="mast-hint" id="hint">drag to wander &middot; pinch to zoom &middot; move the postcards &middot; tap one to open</p>
</header>

<nav class="zoom" aria-label="Zoom">
  <button class="zoom-btn" id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
  <button class="zoom-btn" id="zoom-fit" type="button" aria-label="Back to the postcards">&#8982;</button>
  <button class="zoom-btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
</nav>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <div class="viewer-scrim" data-close></div>
  <figure class="viewer-card" id="viewer-card">
    <div class="banner" id="viewer-banner" aria-hidden="true"></div>
    <div class="viewer-photo" id="viewer-photo">
      <img id="viewer-img" alt="" decoding="async">
    </div>
    <figcaption class="viewer-foot">
      <span class="viewer-title" id="viewer-title"></span>
      <span class="viewer-count" id="viewer-count" aria-live="polite"></span>
    </figcaption>
  </figure>
  <section class="viewer-sheet" id="viewer-sheet" aria-labelledby="sheet-title" hidden>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <div class="sheet-grid" id="sheet-grid"></div>
  </section>
  <button class="viewer-btn viewer-prev" id="viewer-prev" type="button" aria-label="Previous photo">&larr;</button>
  <button class="viewer-btn viewer-next" id="viewer-next" type="button" aria-label="Next photo">&rarr;</button>
  <button class="viewer-btn viewer-grid" id="viewer-grid" type="button" aria-label="See all photos" aria-pressed="false">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><g fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.2"/><rect x="11" y="2" width="7" height="7" rx="1.2"/><rect x="2" y="11" width="7" height="7" rx="1.2"/><rect x="11" y="11" width="7" height="7" rx="1.2"/></g></svg>
  </button>
  <button class="viewer-btn viewer-close" type="button" aria-label="Close" data-close>&times;</button>
</div>

<div class="letter-view" id="letter-view" role="dialog" aria-modal="true" aria-labelledby="lv-label" hidden>
  <div class="viewer-scrim" data-lclose></div>
  <div class="lv-env" id="lv-env" aria-hidden="true">
    <span class="lv-back"></span>
    <span class="lv-slip"></span>
    <span class="lv-front"><span class="fold fold--sides"><i></i></span><span class="fold fold--bottom"><i></i></span></span>
    <span class="lv-flap"><span class="fold fold--top"><i></i></span></span>
  </div>
  <article class="lv-letter" id="lv-letter" tabindex="-1">
    <h2 class="lv-label" id="lv-label"></h2>
    <div class="lv-text" id="lv-text"></div>
  </article>
  <button class="viewer-btn viewer-close" type="button" aria-label="Close letter" data-lclose>&times;</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="store.js?v=8"></script>
<script src="postcards.js?v=8"></script>
<script src="letters.js?v=8"></script>
<script src="canvas.js?v=8"></script>
<script src="/analytics.js" defer></script>
</body>
</html>
